<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Render Mail Login</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #fafafa; margin: 0; }
        .box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 280px; text-align: center; border: 1px solid #eaeaea; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #000; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="box">
    <div id="login-stage">
        <h3>Sign In</h3>
        <input type="email" id="email" placeholder="name@domain.com" required>
        <button id="action-btn" onclick="requestLink()">Verify Email</button>
    </div>

    <div id="wait-stage" class="hidden">
        <h3>Link Dispatched</h3>
        <p>Check your inbox. Tap the confirmation link to immediately trigger validation.</p>
    </div>

    <div id="complete-stage" class="hidden">
        <h3>Success! 🎉</h3>
        <p>Access authorized via secure token verification.</p>
    </div>
</div>

<script>
    let tracker;

    async function requestLink() {
        const email = document.getElementById('email').value;
        if (!email) return alert('Email required');

        document.getElementById('action-btn').innerText = 'Processing...';

        const res = await fetch('/api/auth/send-link', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });

        if (res.ok) {
            document.getElementById('login-stage').classList.add('hidden');
            document.getElementById('wait-stage').classList.remove('hidden');
            beginTracking(email);
        } else {
            alert('Submission processing failure.');
            document.getElementById('action-btn').innerText = 'Verify Email';
        }
    }

    function beginTracking(email) {
        tracker = setInterval(async () => {
            const res = await fetch(`/api/auth/status?email=${encodeURIComponent(email)}`);
            const status = await res.json();

            if (status.authenticated) {
                clearInterval(tracker);
                document.getElementById('wait-stage').classList.add('hidden');
                document.getElementById('complete-stage').classList.remove('hidden');
            }
        }, 2000);
    }
</script>
</body>
</html>
