\<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Render Mail Login</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #fafafa; margin: 0; }
        .box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 280px; text-align: center; border: 1px solid #eaeaea; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; }
        button { width: 100%; padding: 10px; background: #000; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .hidden { display: none; }
        .error-log { margin-top: 15px; padding: 10px; background: #fff0f0; border: 1px solid #ffcaca; color: #cc0000; border-radius: 5px; font-size: 12px; text-align: left; word-break: break-all; }
    </style>
</head>
<body>

<div class="box">
    <!-- Screen Stage 1: Input -->
    <div id="login-stage">
        <h3>Sign In</h3>
        <input type="email" id="email" placeholder="name@domain.com" required>
        <button id="action-btn" onclick="requestLink()">Verify Email</button>
    </div>

    <!-- Screen Stage 2: Waiting -->
    <div id="wait-stage" class="hidden">
        <h3>Link Dispatched</h3>
        <p>Check your inbox. Tap the confirmation link to immediately trigger validation.</p>
    </div>

    <!-- Screen Stage 3: Success -->
    <div id="complete-stage" class="hidden">
        <h3>Success! 🎉</h3>
        <p>Access authorized via secure token verification.</p>
    </div>

    <!-- On-Screen Debugger for iPad Browser -->
    <div id="debug-box" class="error-log hidden"></div>
</div>

<script>
    let tracker;

    // Helper function to print errors directly onto your iPad screen layout
    function showDebugError(message) {
        const debugBox = document.getElementById('debug-box');
        debugBox.innerText = "Browser Error: " + message;
        debugBox.classList.remove('hidden');
    }

    async function requestLink() {
        const email = document.getElementById('email').value;
        if (!email) return alert('Email required');

        document.getElementById('action-btn').innerText = 'Processing...';
        document.getElementById('debug-box').classList.add('hidden'); // Clear past errors

        // Construct absolute path using current window location to bypass relative routing bugs
        const targetUrl = window.location.origin + '/api/auth/send-link';

        try {
            const res = await fetch(targetUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });

            if (res.ok) {
                document.getElementById('login-stage').classList.add('hidden');
                document.getElementById('wait-stage').classList.remove('hidden');
                beginTracking(email);
            } else {
                // If the server answered but returned a failing status code
                const errorData = await res.json().catch(() => ({ error: 'Unknown server error' }));
                document.getElementById('action-btn').innerText = 'Verify Email';
                showDebugError(`Server responded with status ${res.status}. Message: ${errorData.error || JSON.stringify(errorData)}`);
            }
        } catch (networkError) {
            // If the browser blocked the request completely before hitting Render
            document.getElementById('action-btn').innerText = 'Verify Email';
            showDebugError(networkError.message);
        }
    }

    function beginTracking(email) {
        const statusUrl = window.location.origin + `/api/auth/status?email=${encodeURIComponent(email)}`;
        
        tracker = setInterval(async () => {
            try {
                const res = await fetch(statusUrl);
                if (res.ok) {
                    const status = await res.json();
                    if (status.authenticated) {
                        clearInterval(tracker);
                        document.getElementById('wait-stage').classList.add('hidden');
                        document.getElementById('complete-stage').classList.remove('hidden');
                    }
                }
            } catch (pollError) {
                console.error("Polling connectivity dropped:", pollError);
            }
        }, 2000);
    }
</script>
</body>
</html>
